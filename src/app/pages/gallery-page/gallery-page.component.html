<div class="gallery-page">
	<app-background-image-card
		[src]="'/assets/general-background-images/market-morning-1.webp'"
		[isPageTitle]="true"
		[title]="'Gallery'"
		[desc]="'Select one of the cards to view more!'"
	></app-background-image-card>
	@if (loadState.failed()) {
		<app-fallback-panel
			heading="Couldn't load the gallery"
			[busy]="loadState.retrying()"
			(action)="setGalleryCollections()"
		>
			The server didn't answer. Check your connection and try again.
		</app-fallback-panel>
	} @else if (collectionCards()?.length === 0) {
		<p class="empty-message">No galleries yet. Check back soon!</p>
	} @else {
		<app-card-selection-section
			[items]="collectionCards() ?? []"
		></app-card-selection-section>
	}
</div>
