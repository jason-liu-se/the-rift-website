<div class="map-page">
	<app-background-image-card
		[src]="'../../../assets/general-background-images/mountain-side-1.webp'"
		[isPageTitle]="true"
		[title]="'Maps'"
		[desc]="'Select one of the cards to view the associated map!'"
	></app-background-image-card>
	@if (loadState.failed()) {
		<app-error-state
			heading="Couldn't load the maps"
			[busy]="loadState.retrying()"
			(action)="loadSeasons()"
		>
			The server didn't answer. Check your connection and try again.
		</app-error-state>
	} @else {
		<div class="seasons">
			@for (season of seasons(); track season.title) {
				<app-section-card
					[backgroundType]="'light'"
					[title]="season.title"
					[paddingY]="false"
				>
					<app-card-selection-section
						[items]="season.cards"
					></app-card-selection-section>
				</app-section-card>
			}
		</div>
	}
</div>
