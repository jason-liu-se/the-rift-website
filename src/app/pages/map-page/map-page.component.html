<div class="map-page">
	<app-background-image-card
		[src]="'../../../assets/general-background-images/mountain-side-1.webp'"
		[isPageTitle]="true"
		[title]="'Maps'"
		[desc]="'Select one of the cards to view the associated map!'"
	></app-background-image-card>
	<div class="seasons">
		@for (season of seasons(); track season.title) {
			<app-section-card
				[backgroundType]="'light'"
				[title]="season.title"
				[paddingY]="false"
			>
				<app-card-selection-section
					[items]="season.cards"
				></app-card-selection-section>
			</app-section-card>
		}
	</div>
</div>
