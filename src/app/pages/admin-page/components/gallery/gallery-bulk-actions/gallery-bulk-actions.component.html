<app-move-bulk-action />
<button mat-button type="button" (click)="openTags()">
	<mat-icon>sell</mat-icon>
	Tags
</button>
<ng-template #tagsDialog>
	<h2 mat-dialog-title>Add or remove tags</h2>
	<mat-dialog-content>
		<app-tag-input
			label="Tags"
			[tags]="tags()"
			(tagsChange)="tags.set($event)"
		/>
	</mat-dialog-content>
	<mat-dialog-actions>
		<button mat-button type="button" mat-dialog-close>Cancel</button>
		<button
			mat-stroked-button
			type="button"
			[disabled]="tags().length === 0"
			(click)="changeTags('remove-tags')"
		>
			Remove tags
		</button>
		<button
			mat-flat-button
			color="primary"
			type="button"
			[disabled]="tags().length === 0"
			(click)="changeTags('add-tags')"
		>
			Add tags
		</button>
	</mat-dialog-actions>
</ng-template>
