<mat-form-field subscriptSizing="dynamic">
	<mat-label>Collection</mat-label>
	<mat-select
		required
		[ngModel]="fields().collection"
		(ngModelChange)="update({ collection: $event })"
	>
		@for (collection of collections(); track collection.slug) {
			<mat-option [value]="collection.slug">{{
				collection.title
			}}</mat-option>
		}
	</mat-select>
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>Title</mat-label>
	<input
		matInput
		required
		[maxlength]="maxTitleLength"
		[ngModel]="fields().title ?? ''"
		(ngModelChange)="update({ title: $event })"
	/>
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>Description</mat-label>
	<textarea
		matInput
		required
		rows="3"
		[maxlength]="maxDescLength"
		[ngModel]="fields().desc ?? ''"
		(ngModelChange)="update({ desc: $event })"
	></textarea>
	<mat-hint align="end"
		>{{ (fields().desc ?? "").length }} / {{ maxDescLength }}</mat-hint
	>
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>Download link</mat-label>
	<input
		matInput
		required
		type="url"
		[maxlength]="maxUrlLength"
		[ngModel]="fields().downloadUrl ?? ''"
		(ngModelChange)="update({ downloadUrl: $event })"
	/>
</mat-form-field>
<app-image-field
	[album]="{ album: 'downloads' }"
	[url]="fields().imageUrl ?? ''"
	(urlChange)="update({ imageUrl: $event })"
/>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>Sort order</mat-label>
	<input
		matInput
		type="number"
		step="1"
		[ngModel]="fields().sortOrder ?? ''"
		(ngModelChange)="setSortOrder($event)"
	/>
	<mat-hint>Lowest first. Empty: after the numbered ones, by title.</mat-hint>
</mat-form-field>
<section class="preview" aria-labelledby="downloads-preview-label">
	<p class="preview-label" id="downloads-preview-label">Preview</p>
	<div inert>
		<app-download-card
			[title]="fields().title ?? ''"
			[desc]="fields().desc ?? ''"
			[src]="fields().downloadUrl ?? ''"
			[imgSrc]="fields().imageUrl ?? ''"
		/>
	</div>
</section>
