<mat-form-field subscriptSizing="dynamic">
	<mat-label>Collection</mat-label>
	<mat-select
		required
		[ngModel]="fields().collection"
		(ngModelChange)="update({ collection: $event })"
	>
		@for (collection of collections(); track collection.slug) {
			<mat-option [value]="collection.slug">{{
				collection.title
			}}</mat-option>
		}
	</mat-select>
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>Title</mat-label>
	<input
		matInput
		required
		[maxlength]="maxTitleLength"
		[ngModel]="fields().title ?? ''"
		(ngModelChange)="update({ title: $event })"
	/>
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>Description</mat-label>
	<textarea
		matInput
		required
		rows="3"
		cdkTextareaAutosize
		cdkAutosizeMinRows="3"
		cdkAutosizeMaxRows="12"
		[maxlength]="maxDescLength"
		[ngModel]="fields().desc ?? ''"
		(ngModelChange)="update({ desc: $event })"
	></textarea>
	@if (isNearLimit(fields().desc, maxDescLength)) {
		<mat-hint align="end"
			>{{ (fields().desc ?? "").length }} / {{ maxDescLength }}</mat-hint
		>
	}
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>Download link</mat-label>
	<input
		matInput
		required
		type="url"
		[maxlength]="maxUrlLength"
		[ngModel]="fields().downloadUrl ?? ''"
		(ngModelChange)="update({ downloadUrl: $event })"
	/>
</mat-form-field>
<app-image-field
	required
	[album]="{ album: 'downloads' }"
	[url]="fields().imageUrl ?? ''"
	(urlChange)="update({ imageUrl: $event })"
/>
