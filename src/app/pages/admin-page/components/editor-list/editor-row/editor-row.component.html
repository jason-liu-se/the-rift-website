@let row = this.row();
<td class="select">
	<mat-checkbox
		color="primary"
		[aria-label]="'Select ' + row.name"
		[checked]="isSelected()"
		(change)="toggleSelected()"
	/>
</td>
<td class="main">
	@if (row.kind === "item") {
		<ng-container
			*ngComponentOutlet="itemCell(); inputs: { item: row.item }"
		/>
	} @else {
		<span class="draft">
			@if (row.draft.fields.imageUrl) {
				<img
					class="thumbnail"
					[src]="row.draft.fields.imageUrl"
					alt=""
					loading="lazy"
				/>
			}
			<span>{{ row.name }}</span>
		</span>
	}
</td>
<td class="status">
	@if (row.kind === "item") {
		<app-status-badge
			[status]="row.item.status"
			[hasDraft]="row.hasDraft"
		/>
	} @else {
		<app-status-badge [status]="row.isEdit ? 'edit' : 'draft'" />
	}
</td>
<td class="updated">
	<app-editor-avatar [editor]="updatedBy()" />
	<time [attr.datetime]="updatedAt()" [title]="updatedAtText()">{{
		updatedAgo()
	}}</time>
</td>
<td class="actions">
	<button
		mat-icon-button
		type="button"
		[attr.aria-label]="'More actions for ' + row.name"
		[matMenuTriggerFor]="rowMenu"
	>
		<mat-icon>more_vert</mat-icon>
	</button>
	<mat-menu #rowMenu="matMenu" xPosition="before">
		@if (row.kind === "item") {
			<button mat-menu-item (click)="actions.duplicate(row.item)">
				<mat-icon>content_copy</mat-icon>
				Duplicate
			</button>
			<button mat-menu-item (click)="actions.toggleVisibility(row)">
				<mat-icon>{{
					row.item.visible ? "visibility_off" : "visibility"
				}}</mat-icon>
				{{ row.item.visible ? "Hide from site" : "Show on site" }}
			</button>
			@if (publicPath(); as path) {
				<a mat-menu-item target="_blank" [href]="path">
					<mat-icon>open_in_new</mat-icon>
					View on site
				</a>
			}
			<mat-divider />
		}
		<button mat-menu-item class="danger" (click)="actions.delete(row)">
			<mat-icon>delete</mat-icon>
			Delete
		</button>
	</mat-menu>
</td>
