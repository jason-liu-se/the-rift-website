<mat-form-field subscriptSizing="dynamic">
	<mat-label>{{ label() }}</mat-label>
	<mat-chip-grid #chipGrid [attr.aria-label]="label()">
		@for (tag of tags(); track tag) {
			<mat-chip-row (removed)="removeTag(tag)">
				{{ tag }}
				<button matChipRemove [attr.aria-label]="'Remove tag ' + tag">
					<mat-icon>cancel</mat-icon>
				</button>
			</mat-chip-row>
		}
	</mat-chip-grid>
	<input
		[attr.aria-label]="'Add a tag to ' + label().toLowerCase()"
		[attr.maxlength]="maxTagLength"
		[disabled]="isFull()"
		[matChipInputFor]="chipGrid"
		[matChipInputSeparatorKeyCodes]="separatorKeys"
		[matChipInputAddOnBlur]="true"
		[matAutocomplete]="suggestionList"
		(matChipInputTokenEnd)="addTypedTag($event)"
		(input)="setTyped($event)"
	/>
	<mat-autocomplete
		#suggestionList="matAutocomplete"
		(optionSelected)="addSuggestion($event)"
	>
		@for (tag of matchingSuggestions(); track tag) {
			<mat-option [value]="tag">{{ tag }}</mat-option>
		}
	</mat-autocomplete>
	<mat-hint
		>{{ tags().length }} / {{ maxTags() }}. Enter or comma adds
		one.</mat-hint
	>
</mat-form-field>
