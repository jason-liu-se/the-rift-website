<div
	class="create-button"
	role="group"
	[attr.aria-label]="'Add ' + config().noun.many"
>
	<a
		mat-flat-button
		color="primary"
		class="main"
		routerLink="new"
		queryParamsHandling="preserve"
		[class.split]="config().hasBulkCreate"
	>
		New {{ config().noun.one }}
	</a>
	@if (config().hasBulkCreate) {
		<button
			mat-flat-button
			color="primary"
			class="arrow"
			type="button"
			[attr.aria-label]="'More ways to add ' + config().noun.many"
			[matMenuTriggerFor]="moreWays"
		>
			<mat-icon>arrow_drop_down</mat-icon>
		</button>
		<mat-menu #moreWays="matMenu" xPosition="before">
			<a mat-menu-item routerLink="bulk" queryParamsHandling="preserve">
				Add many {{ config().noun.many }}
			</a>
		</mat-menu>
	}
</div>
