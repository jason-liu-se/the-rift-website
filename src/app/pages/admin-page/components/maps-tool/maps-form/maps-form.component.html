<mat-form-field subscriptSizing="dynamic">
	<mat-label>Season</mat-label>
	<input
		matInput
		required
		type="number"
		min="0"
		step="1"
		[ngModel]="fields().season ?? ''"
		(ngModelChange)="setSeason($event)"
	/>
	<mat-hint>Each season has one map.</mat-hint>
</mat-form-field>
<app-image-field
	label="Season image"
	[album]="{ album: 'maps' }"
	[url]="fields().imageUrl ?? ''"
	(urlChange)="setImageUrl($event)"
/>
<section aria-labelledby="dimensions-heading">
	<h3 id="dimensions-heading" class="dimensions-heading">Dimensions</h3>
	<app-dimensions-editor
		[dimensions]="fields().dimensions ?? []"
		(dimensionsChange)="setDimensions($event)"
	/>
</section>
