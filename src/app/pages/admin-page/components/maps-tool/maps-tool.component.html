<app-content-tool
	type="maps"
	[noun]="noun"
	[searchFields]="searchFields"
	[newItemFields]="newSeasonFields"
	[itemTemplate]="item"
	[fieldsTemplate]="fields"
/>
<ng-template #item let-season>
	Season {{ season.season }}
	<span class="details">
		{{ season.dimensionCount }}
		{{ season.dimensionCount === 1 ? "dimension" : "dimensions" }}
	</span>
</ng-template>
<ng-template #fields let-session>
	<app-maps-form [session]="session" />
</ng-template>
