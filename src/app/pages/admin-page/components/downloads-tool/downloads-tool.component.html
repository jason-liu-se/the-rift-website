<app-content-tool
	type="downloads"
	[noun]="noun"
	[searchFields]="searchFields"
	[itemTemplate]="item"
	[fieldsTemplate]="fields"
	[bulkActionsTemplate]="bulkActions"
>
</app-content-tool>
<ng-template #item let-download>
	{{ download.title }}
	<span class="details"
		>{{ download.collection
		}}{{
			download.sortOrder !== undefined ? " · #" + download.sortOrder : ""
		}}</span
	>
</ng-template>
<ng-template #fields let-session>
	<app-downloads-form [session]="session" />
</ng-template>
<ng-template #bulkActions let-list>
	<app-move-bulk-action
		[collections]="list.collections() ?? []"
		(runAction)="list.runBulkAction($event)"
	/>
</ng-template>
