<header class="top-bar">
	<h1 class="tool-title" tabindex="-1" #heading>
		{{ config().label }}<span class="cdk-visually-hidden"> – Admin</span>
	</h1>
</header>
<div class="tool-card">
	<div class="tool-actions">
		<app-create-button [type]="type()" />
		@if (collectionType(); as collectionType) {
			<button
				mat-stroked-button
				type="button"
				[attr.aria-expanded]="isManagingCollections()"
				(click)="isManagingCollections.set(!isManagingCollections())"
			>
				Collections
			</button>
			@if (isManagingCollections()) {
				<app-collections-manager
					class="collections"
					[type]="collectionType"
					[itemNoun]="config().noun"
					(changed)="store.reload()"
				/>
			}
		}
	</div>
	<!-- A new list per tool: switching tools starts with its own filters. -->
	@for (listType of [type()]; track listType) {
		<app-editor-list
			[type]="listType"
			(editItem)="openItem($event)"
			(duplicateItem)="duplicate($event)"
			(openDraft)="openDraft($event)"
		/>
	}
</div>
<router-outlet />
