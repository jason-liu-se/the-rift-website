@if (isBulkCreating()) {
	<app-gallery-bulk-create (closed)="isBulkCreating.set(false)" />
} @else {
	<app-content-tool
		type="gallery"
		[noun]="noun"
		[searchFields]="searchFields"
		[itemTemplate]="item"
		[fieldsTemplate]="fields"
		[bulkActionsTemplate]="bulkActions"
	>
		<button
			toolActions
			mat-stroked-button
			type="button"
			(click)="isBulkCreating.set(true)"
		>
			Add many images
		</button>
	</app-content-tool>
}
<ng-template #item let-image>
	<span class="image-item">
		<img class="thumbnail" [src]="image.imageUrl" alt="" loading="lazy" />
		<span>
			{{ image.caption }}
			<span class="details"
				>{{ image.collection
				}}{{
					image.tags.length ? " · " + image.tags.join(", ") : ""
				}}</span
			>
		</span>
	</span>
</ng-template>
<ng-template #fields let-session>
	<app-gallery-form [session]="session" />
</ng-template>
<ng-template #bulkActions let-list>
	<app-gallery-bulk-actions
		[collections]="list.collections() ?? []"
		(runAction)="list.runBulkAction($event)"
	/>
</ng-template>
