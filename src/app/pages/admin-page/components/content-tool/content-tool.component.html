@if (session(); as session) {
	<app-draft-editor
		[session]="session"
		[published]="published()"
		(publishedItem)="closeEditor()"
		(closed)="closeEditor()"
	>
		<ng-container *ngComponentOutlet="config().form; inputs: { session }" />
	</app-draft-editor>
} @else if (isBulkCreating()) {
	<app-gallery-bulk-create (closed)="isBulkCreating.set(false)" />
} @else if (isOpening()) {
	<p role="status">Opening…</p>
} @else {
	<div class="tool-actions">
		<button
			mat-flat-button
			color="primary"
			type="button"
			(click)="openNew()"
		>
			New {{ config().noun.one }}
		</button>
		@if (config().hasBulkCreate) {
			<button
				mat-stroked-button
				type="button"
				(click)="isBulkCreating.set(true)"
			>
				Add many {{ config().noun.many }}
			</button>
		}
		@if (collectionType(); as collectionType) {
			<button
				mat-stroked-button
				type="button"
				[attr.aria-expanded]="isManagingCollections()"
				(click)="isManagingCollections.set(!isManagingCollections())"
			>
				Collections
			</button>
			@if (isManagingCollections()) {
				<app-collections-manager
					class="collections"
					[type]="collectionType"
					[itemNoun]="config().noun"
					(changed)="reloadList()"
				/>
			}
		}
	</div>
	<app-editor-list
		#list
		[type]="type()"
		(editItem)="openEditor('edit', $event.id)"
		(duplicateItem)="openEditor('duplicate', $event.id)"
		(openDraft)="openEditor('draft', $event.id)"
	/>
}
