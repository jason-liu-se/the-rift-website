<div class="admin-login-page">
	<div class="sign-in-panel">
		<img
			class="logo"
			src="/assets/navbar/rift-logo.png"
			alt=""
			width="1200"
			height="274"
		/>
		<h1 class="heading">Log in to The Rift admin</h1>
		<p class="intro">Editors log in with their Discord account.</p>
		@if (errorMessage) {
			<app-feedback-card title="Couldn't log you in">
				{{ errorMessage }}
			</app-feedback-card>
		}
		<!-- The region is always in the DOM, so the message is announced. -->
		<div aria-live="polite">
			@if (apiUnreachable()) {
				<app-feedback-card title="Couldn't reach The Rift">
					Check your connection and try again.
				</app-feedback-card>
			}
		</div>
		<button
			mat-flat-button
			type="button"
			color="primary"
			class="discord-button"
			[attr.aria-disabled]="starting() || null"
			[attr.aria-busy]="starting() || null"
			(click)="startLogin()"
		>
			Continue with Discord
		</button>
	</div>
	<!-- Portrait screens get a crop around the tree: the photo covers the
	whole page there, so most of the wide image would be cut off anyway. -->
	<picture class="photo-frame">
		<source
			media="(max-width: 59.99rem) and (orientation: portrait)"
			srcset="
				/assets/general-background-images/fancy-tree-1-portrait.webp
			"
			width="810"
			height="1080"
		/>
		<img
			class="photo"
			src="/assets/general-background-images/fancy-tree-1.webp"
			alt=""
			width="1920"
			height="1080"
		/>
	</picture>
</div>
