<app-admin-bar />
<div class="admin-page">
	<nav class="tool-nav" aria-label="Admin tools">
		<ul class="tool-list">
			@for (tool of tools; track tool.id) {
				<li>
					<a
						class="tool-link"
						routerLinkActive="active"
						ariaCurrentWhenActive="page"
						[routerLink]="['/admin', tool.id]"
					>
						<mat-icon aria-hidden="true">{{ tool.icon }}</mat-icon>
						<span class="tool-label">{{ tool.label }}</span>
					</a>
				</li>
			}
		</ul>
	</nav>
	<!-- The page's <main>: the shell leaves it to pages without the navbar. -->
	<main class="workspace">
		<router-outlet />
	</main>
</div>
