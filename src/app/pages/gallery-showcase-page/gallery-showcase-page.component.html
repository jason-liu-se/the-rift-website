<div class="gallery-showcase">
	<app-background-image-card
		[src]="imageUrl"
		[isPageTitle]="true"
		[title]="title"
	></app-background-image-card>
	<div class="paginated-image-showcase-container">
		<div class="image-showcase-header">
			<app-back-button [destination]="'/gallery'" [title]="'Gallery'" />
			@if (paginationLength !== undefined && !loadState.failed()) {
				<p class="page-caption" role="status">
					{{ "Results: " + paginationLength }}
				</p>
			}
		</div>
		@if (loadState.failed()) {
			<app-fallback-panel
				heading="Couldn't load these photos"
				[busy]="loadState.retrying()"
				(action)="populateCaptionedImages()"
			>
				The server didn't answer. Check your connection and try again.
			</app-fallback-panel>
		} @else {
			@if (tags().length > 0) {
				<app-tag-filter
					[tags]="tags()"
					[selected]="selectedTags()"
					(selectedChange)="filterByTags($event)"
				/>
			}
			<mat-paginator
				#paginator
				class="paginator"
				(page)="handlePageEvent($event)"
				[length]="paginationLength ?? 0"
				[pageSize]="pageSize"
				[showFirstLastButtons]="true"
				[pageIndex]="pageIndex"
				[hidePageSize]="true"
				aria-label="Select page"
			>
			</mat-paginator>
			<app-image-showcase-section
				[captionedImages]="captionedImages"
			></app-image-showcase-section>
			<mat-paginator
				#paginator
				class="paginator"
				(page)="handlePageEvent($event)"
				[length]="paginationLength ?? 0"
				[pageSize]="pageSize"
				[showFirstLastButtons]="true"
				[pageIndex]="pageIndex"
				[hidePageSize]="true"
				aria-label="Select page"
			>
			</mat-paginator>
		}
	</div>
</div>
