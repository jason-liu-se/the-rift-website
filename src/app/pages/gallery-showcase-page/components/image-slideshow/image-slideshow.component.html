<div class="image-slideshow">
	<div class="containers">
		<div class="prev-button-container">
			<button
				class="prev"
				(click)="handleClickPrev()"
				[disabled]="isPrevDisabled"
			>
				<mat-icon class="icon">chevron_left</mat-icon>
			</button>
		</div>
		<div class="content-container">
			@if (captionedImages[index].url) {
				<div class="image-frame">
					<!-- Full screen: the original, unresized photo. -->
					<app-optimized-image
						[src]="captionedImages[index].url"
						priority
						original
						[alt]="captionedImages[index].caption"
					/>
				</div>
			}
			<p class="caption">{{ captionedImages[index].caption }}</p>
		</div>
		<div class="next-button-container">
			<button
				class="next"
				(click)="handleClickNext()"
				[disabled]="isNextDisabled"
			>
				<mat-icon class="icon">chevron_right</mat-icon>
			</button>
		</div>
	</div>
</div>
