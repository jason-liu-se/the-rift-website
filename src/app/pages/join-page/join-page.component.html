<div class="join-page">
	<app-background-image-card
		[src]="'../../../assets/general-background-images/water-tower-1.webp'"
		[isPageTitle]="true"
		[title]="'Join'"
		[desc]="'Interested in The Rift? Then this is the right page for you!'"
	></app-background-image-card>
	<app-section-card
		[backgroundType]="'light'"
		[title]="'Want to Join The Rift?'"
		[content]="'Fill out the form and we\'ll get in contact with you if you\'re eligible!'"
		[titlePosition]="'center'"
		[contentPosition]="'center'"
	>
		<a
			class="form-button"
			mat-fab
			extended
			disableRipple
			color="primary"
			[href]="joinFormUrl"
			target="_blank"
			rel="noopener"
		>
			<mat-icon>open_in_new</mat-icon>
			Fill Out Form
			<span class="cdk-visually-hidden">(opens in new tab)</span>
		</a>
	</app-section-card>
</div>
