<div class="page-template">
	<div class="upper-content">
		<app-navbar [transparent]="isTransparent"></app-navbar>
		<main class="template" tabindex="-1" #mainContent>
			<ng-template appPageTemplateHost></ng-template>
		</main>
	</div>
	<div class="lower-content">
		@if (showContactSection) {
			<app-contact></app-contact>
		}
		@if (showFooter) {
			<app-footer class="app-footer"></app-footer>
		}
	</div>
</div>
