<button
	#trigger="ngMenuTrigger"
	ngMenuTrigger
	type="button"
	class="user-button"
	aria-label="Account menu"
	[menu]="accountMenu"
	[class.open]="trigger.expanded()"
>
	<app-user-avatar [showUsername]="false" />
</button>
<!-- Drops below the button, pointing up at it. -->
<div class="panel" [class.open]="trigger.expanded()">
	<app-user-avatar class="panel-header" />
	<div ngMenu #accountMenu="ngMenu" class="menu" aria-label="Account">
		@if (showAdminLink()) {
		<a ngMenuItem value="admin" class="menu-item" [routerLink]="adminPath">
			<span class="material-icons icon" aria-hidden="true"
				>admin_panel_settings</span
			>
			Admin
		</a>
		}
		<button
			ngMenuItem
			value="logout"
			type="button"
			class="menu-item"
			(click)="userLogout.logout()"
		>
			<span class="material-icons icon" aria-hidden="true">logout</span>
			Log out
		</button>
	</div>
</div>
