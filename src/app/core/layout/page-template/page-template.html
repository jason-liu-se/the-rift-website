<div class="page-template">
	<app-status-banner></app-status-banner>
	<div class="upper-content">
		@if (showNavbar) {
		<app-navbar [transparent]="isTransparent"></app-navbar>
		}
		<!-- A page without the navbar has its own app bar, so its own <main>. -->
		@if (showNavbar) {
		<main class="template" tabindex="-1" #mainContent>
			<ng-template appPageOutlet></ng-template>
		</main>
		} @else {
		<div class="template" tabindex="-1" #mainContent>
			<ng-template appPageOutlet></ng-template>
		</div>
		}
	</div>
	<div class="lower-content">
		@if (showContactSection) {
		<app-contact></app-contact>
		} @if (showFooter) {
		<app-footer class="app-footer"></app-footer>
		}
	</div>
</div>
