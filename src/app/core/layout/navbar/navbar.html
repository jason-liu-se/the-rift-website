@if (!transparent) {
<div class="rift-navbar edge-padding"></div>
}
<div
	#wrapper
	class="rift-navbar-wrapper always-visible {{ transparent ? '' : 'opaque' }}"
>
	<nav
		aria-label="Main"
		class="rift-navbar {{ isHamburgerMenuVisible ? 'expand opaque' : '' }}"
	>
		<div class="hamburger-menu">
			<div class="hamburger-menu-buttons">
				<!-- One button opens and closes the menu, so focus stays on it. -->
				<button
					#menuButton
					type="button"
					class="hamburger-menu-button"
					aria-label="Menu"
					aria-controls="site-menu-links"
					[attr.aria-expanded]="isHamburgerMenuVisible"
					(click)="toggleHamburgerMenu()"
				>
					<mat-icon aria-hidden="true"
						>{{ isHamburgerMenuVisible ? "close" : "menu"
						}}</mat-icon
					>
				</button>
			</div>
		</div>
		<ul class="menu-links left-align">
			<li class="link-container">
				<a class="nav-button" routerLink="/">
					<img
						class="rift-logo"
						[src]="logoPath"
						alt="The Rift logo"
					/>
				</a>
			</li>
		</ul>
		<ul
			id="site-menu-links"
			class="menu-links center-align {{
				isHamburgerMenuVisible ? '' : 'hidden'
			}}"
		>
			<li class="link-container">
				<a
					class="nav-link"
					routerLink="/"
					routerLinkActive="link-active"
					[routerLinkActiveOptions]="{ exact: true }"
					><p>Home</p></a
				>
			</li>
			<li class="link-container">
				<a
					class="nav-link"
					routerLink="/news"
					routerLinkActive="link-active"
					><p>News</p></a
				>
			</li>
			<li class="link-container">
				<a
					class="nav-link"
					routerLink="/gallery"
					routerLinkActive="link-active"
					><p>Gallery</p></a
				>
			</li>
			<li class="link-container">
				<a
					class="nav-link"
					routerLink="/map"
					routerLinkActive="link-active"
					><p>Map</p></a
				>
			</li>
			<li class="link-container">
				<a
					class="nav-link"
					routerLink="/downloads"
					routerLinkActive="link-active"
					><p>Downloads</p></a
				>
			</li>

			<li class="link-container">
				<a
					class="nav-link"
					routerLink="/about"
					routerLinkActive="link-active"
					><p>About</p></a
				>
			</li>
			<li class="link-container">
				<a
					class="nav-link"
					routerLink="/contact"
					routerLinkActive="link-active"
					><p>Contact</p></a
				>
			</li>
		</ul>
		<ul
			class="menu-links right-align {{
				isHamburgerMenuVisible ? '' : 'hidden'
			}}"
		>
			<li class="link-container">
				<div class="button-container">
					<button
						class="join-button"
						mat-flat-button
						disableRipple
						color="primary"
						routerLink="/join"
						routerLinkActive="mat-button-active"
					>
						Join
					</button>
				</div>
			</li>
			@if (user()) {
			<li class="user-item">
				@defer (on immediate) {
				<app-user-menu (loggedOut)="isHamburgerMenuVisible = false" />
				}
			</li>
			}
		</ul>
		<br class="{{ isHamburgerMenuVisible ? '' : 'hidden' }}" />
	</nav>
</div>
