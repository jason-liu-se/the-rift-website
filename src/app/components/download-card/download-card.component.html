<div class="download-card-wrapper">
	<div
		class="download-card"
		[style.background-image]="imgSrc ? 'url(' + imgSrc + ')' : null"
	>
		<div class="containers">
			<div class="text-container">
				@if (showTitle) {
					<h2 class="title">{{ title }}</h2>
				}
				@if (showDesc) {
					<p class="description">{{ desc }}</p>
				}
			</div>
			<a
				class="download-button"
				mat-flat-button
				color="primary"
				disableRipple
				[href]="src"
				target="_blank"
				rel="noopener"
			>
				<mat-icon>open_in_new</mat-icon>
				Download
			</a>
		</div>
	</div>
</div>
