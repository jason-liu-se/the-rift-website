<div class="collection-section">
    <div class="collection-wrapper">
        @for (item of items; track item) {
            <div class="collection-card-grid collection-card">
                <div
                    class="background-content"
                    [style.background-image]="'url(' + item.imageUrl + ')'"
                    routerLink="{{ item.routerLink }}"
                ></div>
                <a class="overlay-content" routerLink="{{ item.routerLink }}">
                    <hr class="top-bar" />
                    <h3 class="title">{{ item.title }}</h3>
                    @if (item.desc) {
                        <p
                            class="description {{
                                alwaysShowDesc ? 'high-contrast' : 'transparent'
                            }}"
                        >
                            {{ item.desc }}
                        </p>
                    }
                    <hr class="bottom-bar" />
                </a>
            </div>
        }
    </div>
</div>
