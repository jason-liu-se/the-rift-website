<div
    class="background-image-card"
    [style.background-image]="'url(' + backgroundImgSrc + ')'"
>
    <div class="overlay-content">
        <div class="text-container">
            @if (showTitle) {
                @if (isPageTitle) {
                    <h1 class="title">{{ title }}</h1>
                }
                @if (!isPageTitle) {
                    <h2 class="title">{{ title }}</h2>
                }
            }
            @if (showDescription) {
                <p class="description">{{ description }}</p>
            }
        </div>
    </div>
</div>
