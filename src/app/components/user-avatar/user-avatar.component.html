<div class="avatar" aria-hidden="true">
	@if (avatarUrl(); as url) {
		<img [src]="url" alt="" (error)="avatarFailed.set(true)" />
	} @else if (initial(); as letter) {
		{{ letter }}
	} @else {
		<mat-icon>person</mat-icon>
	}
</div>
@if (showUsername() && user(); as currentUser) {
	<span class="username" [title]="currentUser.username">
		<span class="cdk-visually-hidden">Signed in as</span>
		{{ currentUser.username }}
	</span>
}
