<div class="card-wrapper">
	<div
		class="card"
		[style.background-image]="
			backgroundUrl ? 'url(' + backgroundUrl + ')' : null
		"
	>
		<div class="card-content">
			<div class="card-container">
				<!-- The header image is the page heading (e.g. the logo on the home page). -->
				<h1 class="image-header">
					<img
						class="image"
						src="{{ headerUrl }}"
						[alt]="headerAlt"
					/>
				</h1>
				<div class="description">
					{{ desc }}
				</div>
				<ng-content></ng-content>
			</div>
		</div>
		<div class="down-icon-container">
			<mat-icon class="down-icon">keyboard_arrow_down</mat-icon>
		</div>
	</div>
</div>
