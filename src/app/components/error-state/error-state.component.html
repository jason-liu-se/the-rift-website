	/>

<!-- A failure that replaces content is announced; a 404 page is just a page. -->
<div class="text" [attr.role]="actionLink() ? null : 'alert'">
	@if (headingLevel() === 1) {
		<h1 #headingElement class="heading" tabindex="-1">{{ heading() }}</h1>
	} @else {
		<h2 #headingElement class="heading" tabindex="-1">{{ heading() }}</h2>
	}
	<p class="message"><ng-content /></p>
</div>
@if (actionLink(); as link) {
	<a class="action" [routerLink]="link">{{ actionLabel() }}</a>
} @else {
	<button
		type="button"
		class="action"
		[attr.aria-disabled]="busy() || null"
		(click)="onAction()"
	>
		{{ busy() ? "Trying again…" : actionLabel() }}
	</button>
}
