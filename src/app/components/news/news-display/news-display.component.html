<div class="news-display">
	<ul class="news-container">
		@for (post of newsPosts; track post.id) {
			<li class="news-post">
				@if (post.bannerImg) {
					<div class="banner">
						<img
							class="banner-img"
							[ngSrc]="post.bannerImg"
							fill
							alt=""
						/>
					</div>
				}
				<div class="news-post-content">
					<h2 class="title">{{ post.title }}</h2>
					<h3 class="date">{{ newsPostToDateString(post) }}</h3>
					<hr class="separator" />
					<p class="content">{{ post.content }}</p>
				</div>
			</li>
		}
	</ul>
</div>
