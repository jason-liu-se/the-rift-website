<div class="download-card-wrapper">
	@if (imgSrc) {
	<app-optimized-image class="background" [src]="imgSrc" />
	}
	<div class="download-card">
		<div class="containers">
			<div class="text-container">
				@if (title) {
				<h2 class="title">{{ title }}</h2>
				} @if (desc) {
				<p class="description">{{ desc }}</p>
				}
			</div>
			<a
				class="download-button"
				mat-flat-button
				color="primary"
				disableRipple
				[href]="src"
				target="_blank"
				rel="noopener"
			>
				<mat-icon>open_in_new</mat-icon>
				Download
				<span class="cdk-visually-hidden">(opens in new tab)</span>
			</a>
			@if (editId) {
			<app-edit-button
				type="downloads"
				[itemId]="editId"
				[itemName]="title"
			/>
			}
		</div>
	</div>
</div>
