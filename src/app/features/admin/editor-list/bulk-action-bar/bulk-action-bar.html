<div class="bar">
	<button
		mat-icon-button
		type="button"
		matTooltip="Clear selection (Esc)"
		aria-label="Clear selection"
		(click)="clearSelection()"
	>
		<mat-icon>close</mat-icon>
	</button>
	<p class="count">{{ store.selectedCount() }} selected</p>
	@if (canSelectAllMatching()) {
	<button
		mat-button
		type="button"
		(click)="store.selection.selectAllMatching()"
	>
		<mat-icon>select_all</mat-icon>
		{{ allMatchingLabel() }}
	</button>
	}
	<div class="actions" role="group" aria-label="Bulk actions">
		@if (showCount(); as count) {
		<button
			mat-button
			type="button"
			[disabled]="store.isBusy()"
			(click)="actions.runBulkAction({ action: 'show' })"
		>
			<mat-icon>visibility</mat-icon>
			Show {{ count }}
		</button>
		} @if (hideCount(); as count) {
		<button
			mat-button
			type="button"
			[disabled]="store.isBusy()"
			(click)="actions.runBulkAction({ action: 'hide' })"
		>
			<mat-icon>visibility_off</mat-icon>
			Hide {{ count }}
		</button>
		} @if (hasItems() && store.config().bulkActions; as typeActions) {
		<ng-container *ngComponentOutlet="typeActions" />
		}
		<button
			mat-button
			type="button"
			class="danger"
			[disabled]="store.isBusy()"
			(click)="actions.runBulkAction({ action: 'delete' })"
		>
			<mat-icon>delete</mat-icon>
			Delete
		</button>
	</div>
</div>
