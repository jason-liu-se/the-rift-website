<tr role="row">
	<td class="empty" role="cell" [attr.colspan]="store.columnCount()">
		@if (hasFilters()) {
		<p>No {{ noun().many }} match these filters.</p>
		<button mat-stroked-button type="button" (click)="clearFilters()">
			<mat-icon>close</mat-icon>
			Clear filters
		</button>
		} @else {
		<p>No {{ noun().many }} yet.</p>
		<a
			mat-flat-button
			color="primary"
			[routerLink]="store.config().hasBulkCreate ? 'bulk' : 'new'"
			queryParamsHandling="preserve"
		>
			<mat-icon
				>{{ store.config().hasBulkCreate ? "upload" : "add" }}</mat-icon
			>
			{{ store.config().hasBulkCreate ? "Upload " + noun().many : "New " +
			noun().one }}
		</a>
		}
	</td>
</tr>
