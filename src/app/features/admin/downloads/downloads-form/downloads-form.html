<app-collection-select
	[label]="spec.collection.label"
	type="downloads"
	[required]="!!spec.collection.required"
	[slug]="fields().collection"
	(slugChange)="update({ collection: $event })"
/>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>{{ spec.title.label }}</mat-label>
	<input
		matInput
		[required]="!!spec.title.required"
		[maxlength]="maxTitleLength"
		[ngModel]="fields().title ?? ''"
		(ngModelChange)="update({ title: $event })"
	/>
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>{{ spec.desc.label }}</mat-label>
	<textarea
		matInput
		[required]="!!spec.desc.required"
		rows="3"
		cdkTextareaAutosize
		cdkAutosizeMinRows="3"
		cdkAutosizeMaxRows="12"
		[maxlength]="maxDescLength"
		[ngModel]="fields().desc ?? ''"
		(ngModelChange)="update({ desc: $event })"
	></textarea>
	@if (isNearLimit(fields().desc, maxDescLength)) {
	<mat-hint align="end"
		>{{ (fields().desc ?? "").length }} / {{ maxDescLength }}</mat-hint
	>
	}
</mat-form-field>
<mat-form-field subscriptSizing="dynamic">
	<mat-label>{{ spec.downloadUrl.label }}</mat-label>
	<input
		matInput
		[required]="!!spec.downloadUrl.required"
		type="url"
		[maxlength]="maxUrlLength"
		[ngModel]="fields().downloadUrl ?? ''"
		(ngModelChange)="update({ downloadUrl: $event })"
	/>
</mat-form-field>
<app-image-field
	[label]="spec.imageUrl.label"
	[required]="!!spec.imageUrl.required"
	[album]="{ album: 'downloads' }"
	[url]="fields().imageUrl ?? ''"
	(urlChange)="update({ imageUrl: $event })"
/>
