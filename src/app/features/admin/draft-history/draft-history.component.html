<button
	mat-icon-button
	type="button"
	aria-label="Undo"
	matTooltip="Undo (Ctrl+Z)"
	[disabled]="!session().canUndo()"
	(click)="session().undo()"
>
	<mat-icon>undo</mat-icon>
</button>
<button
	mat-icon-button
	type="button"
	aria-label="Redo"
	matTooltip="Redo (Ctrl+Shift+Z)"
	[disabled]="!session().canRedo()"
	(click)="session().redo()"
>
	<mat-icon>redo</mat-icon>
</button>
