<div class="state">
	@if (problem(); as problem) {
	<p class="problem" role="alert">
		<mat-icon aria-hidden="true">error</mat-icon>
		{{ problem }}
	</p>
	} @else { @if (session().hasUnpublishedChanges()) {
	<span class="changes">
		<span class="dot" aria-hidden="true"></span>
		{{ unpublishedChanges }}
	</span>
	}
	<span
		class="save-status"
		role="status"
		[class.failed]="status() === 'failed'"
		>{{ statusText() }}</span
	>
	@if (status() === "failed") {
	<button mat-button type="button" (click)="retrySave()">Retry</button>
	} }
</div>
<div class="actions">
	@if (hasDraft()) {
	<button mat-button type="button" class="discard" (click)="discard()">
		{{ isEdit() ? "Discard changes" : "Discard" }}
	</button>
	}
	<app-visibility-toggle
		class="visibility"
		[visible]="isVisible()"
		(visibleChange)="setVisible($event)"
	/>
	<button
		mat-flat-button
		color="primary"
		type="button"
		class="publish"
		[disabled]="isPublishing() || !!session().conflict()"
		(click)="publish.emit()"
	>
		<mat-icon aria-hidden="true"
			>{{ isScheduled() ? "schedule" : "publish" }}</mat-icon
		>
		<!-- Every label in one place, only the current one shown, so the
			button is always its widest label's width. -->
		<span class="publish-labels">
			@for (label of publishLabels; track label) { @let isCurrent = label
			=== currentPublishLabel();
			<span
				[class.current]="isCurrent"
				[attr.aria-hidden]="isCurrent ? null : true"
				>{{ label }}</span
			>
			}
		</span>
	</button>
</div>
